# dsh-session-cost bundle patch: one loader row over the web profile.
# The row name resolves from the profile's own node_modules where
# `dsh plugin --profile web add <path>` installed this package.
#
# config 全可选(缺省即默认:CNY 显示币种、在线汇率、内置表兜底);
# 这里的值是 settings 命名空间 session-cost 的 base 层——用户在
# 设置→插件→session-cost 或 settings.yaml 里的编辑覆盖它,实时生效:
#   currency: CNY        # ISO 4217 币种码(非三字母原样用,仅查内置表)
#   exchangeRate: 7.2    # 显式钉死汇率(离线用);缺省则在线查询(frankfurter.dev)
#   decimals: 4          # 小数位覆盖(0-10)
#   symbol: ¥            # 货币符号覆盖
- insert:
    - id: session-cost
      name: dsh-session-cost
      config: {}
