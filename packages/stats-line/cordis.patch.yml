# dsh-stats-line bundle patch: one loader row over the web profile.
# The row name resolves from the profile's own node_modules where
# `dsh plugin --profile web add <path>` installed this package.
#
# config(全部可选,缺省即可用;这里的值是 settings 命名空间 stats-line
# 的 base 层——用户在 设置→插件→stats-line 或 settings.yaml 里的编辑会
# 覆盖它,实时生效):
#   ui: 旧 items 形态的组件序列(数组或 { items }),经迁移展开为
#     新模板组件模型的 sections;非法配置整体回退默认。
# 模型:行 = 小组数组(小组间固定 '|');小组 = { sep?, components }
#   (sep 覆盖内部连接符,默认 '·','' 贴死);组件 = 模板字符串
#   ('LLM $llm',$name 引用值,$$ 转义)或 { show, hint? }。值词表:
#   $turns $steps $llm $tools $ttft $tps $ttftLast $tpsLast $input
#   $output $cache $cost。值不可得 → 组件消失;小组全空 → 整组消失;
#   连接符渲染时生成。$cost 的数据与格式化来自 dsh-session-cost(未
#   安装则引用它的组件自动不渲染)。
- insert:
    - id: stats-line
      name: dsh-stats-line
      config: {}
