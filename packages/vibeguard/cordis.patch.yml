# dsh-vibeguard bundle patch: one loader row over the web profile.
# The row name resolves from the profile's own node_modules where
# `dsh plugin --profile web add <path>` installed this package.
#
# config(均可选):
#   enabled: 总开关(默认 true)
#   rules: 自定义规则 [{name, pattern, flags?, group?, minLength?}],排在内置规则之前
#   disabledBuiltinRules: [name…] 按名关闭内置规则
#   denyPaths: 敏感路径列表(子串匹配,~ 展开;默认值见 src/config.ts)
#   redactUserMessages: 是否脱敏用户消息(默认 true)
#   inlineNotice: tool 结果尾部是否附脱敏标记(默认 true)
- insert:
    - id: vibeguard
      name: dsh-vibeguard
